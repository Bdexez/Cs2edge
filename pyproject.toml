[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2edge"
version = "0.1.0"
description = "Analyse de matchs CS2 professionnels et estimation calibree des probabilites de victoire"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gbdt = ["scikit-learn>=1.3"]

[project.scripts]
cs2edge = "cs2edge.cli:main"

[tool.setuptools]
packages = ["cs2edge"]
