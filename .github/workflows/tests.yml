name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: NumPy / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python: '3.9'
            os: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: Minimum supported NumPy
        if: matrix.python == '3.9'
        run: python -m pip install numpy==1.24.0
      - run: python -m unittest discover -s tests -v
      - run: cs2edge backtest --no-gbdt
      - name: Reuse trained analyzer without CSV input
        run: |
          cs2edge train --no-gbdt --bundle /tmp/analyzer.cs2edge
          cs2edge predict navi g2 --model /tmp/analyzer.cs2edge --date 2026-11-11
          cs2edge slate --model /tmp/analyzer.cs2edge --fixtures data/fixtures.csv --record /tmp/journal.csv

  gbdt:
    name: Optional GBDT / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CS2EDGE_REQUIRE_GBDT: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[gbdt]'
      - run: python -m unittest discover -s tests -v
      - run: cs2edge backtest
      - name: Reuse trained GBDT analyzer
        run: |
          cs2edge train --bundle /tmp/analyzer.cs2edge
          cs2edge predict navi g2 --model /tmp/analyzer.cs2edge --date 2026-11-11
          cs2edge slate --model /tmp/analyzer.cs2edge --fixtures data/fixtures.csv --record /tmp/journal.csv
