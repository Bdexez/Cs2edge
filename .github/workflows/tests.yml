name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: NumPy / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: Minimum supported NumPy
        if: matrix.python == '3.9'
        run: python -m pip install numpy==1.24.0
      - run: python -m unittest discover -s tests -v
      - run: cs2edge backtest --no-gbdt

  gbdt:
    name: Optional GBDT / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CS2EDGE_REQUIRE_GBDT: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[gbdt]'
      - run: python -m unittest discover -s tests -v
      - run: cs2edge backtest
